# Which model server the agent talks to.
# tiny = main model; smart = speculative decoding model.
# Both run on the same local server on your machine.
servers:
  tiny: "http://127.0.0.1:8080/v1"
  smart: "http://127.0.0.1:8080/v1"

model: "tiny"

# Tavily free tier. Set TAVILY_API_KEY env var (env wins); do not commit a real key.
tavily_api_key: ""

# Agent behaviour
max_tool_rounds: 20   # safety cap on tool calls per turn
max_consecutive_tool_calls: 5   # human checkpoint after N tool calls without answer
human_checkpoint_enabled: true

# Shell tool
allow_shell: true
# Every shell command requires confirmation before running.

# Agent autonomy / permissions
# Approval is valid for this many minutes; after that the agent must ask again.
approval_interval_minutes: 30

# Logging / streaming
log_dir: "logs"
stream_to_console: true
# Log every model message + tool call as JSON lines for audit/replay.
log_events: true
