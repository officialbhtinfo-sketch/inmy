# Which model server the agent talks to. Labels are just names.
servers:
  tiny: "http://127.0.0.1:8080/v1"   # BT
  smart: "http://127.0.0.1:8080/v1"   # LT

model: "tiny"        # BT

# Tavily free tier. Paste your key here, or set TAVILY_API_KEY env var (env wins).
tavily_api_key: ""   # Set via TAVILY_API_KEY env var; do not commit a real key

# Agent behaviour
max_tool_rounds: 20   # safety cap on tool calls per turn

# Shell tool
allow_shell: true
# Every shell command requires confirmation before running.
